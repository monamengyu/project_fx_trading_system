# Root pytest config so the suite runs from the repo root OR from backend/.
# `pythonpath` makes backend/ importable as `app`; `testpaths` limits the
# root-level collection to the backend tests.

[pytest]
testpaths = backend/tests
pythonpath = backend
# run async tests automatically
asyncio_mode = auto
# share one event loop across the whole test session so the module-level
# SQLAlchemy async engine (app/db/session.py) isn't reused across event loops
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
